apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime-chat-ui-ingress
  namespace: frontend
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: realtime-chat-ui-service
            port:
              number: 80
